# Render Blueprint. Apply with: Render dashboard -> New -> Blueprint.
#
# Deployed as a *web service*, not a background worker: the agent loops run
# inside this same process, and Render's free tier covers web services only.
#
# Free tier caveats this file cannot solve:
#   * Render sleeps a free web service after 15 minutes without inbound
#     traffic. An external pinger must hit /health (see README).
#   * The 750 free instance hours per month are shared across the whole
#     workspace, so this must be the only always-on free service.
#   * Postgres is deliberately NOT defined here — Render's free database is
#     deleted 30 days after creation. Point DATABASE_URL at Neon instead.

services:
  - type: web
    name: options-m
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    # Liveness only. /ready would restart the service on a database blip.
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json

      # Neon bills compute time, and an idle pooled connection keeps its
      # compute awake. Hold no idle connections, and stay small: the free
      # instance has little memory to spare.
      - key: DB_POOL_MIN_SIZE
        value: "0"
      - key: DB_POOL_MAX_SIZE
        value: "2"
      - key: DB_POOL_MAX_IDLE_SECONDS
        value: "60"

      # Every tick that touches the database keeps Neon's compute awake, and
      # the free plan allows 100 compute-hours per month. Pace accordingly.
      - key: AGENT_INTERVAL_SECONDS
        value: "60"
      - key: AGENT_ERROR_BACKOFF_SECONDS
        value: "10"
      - key: AGENT_MAX_BACKOFF_SECONDS
        value: "600"

      # Render sends SIGTERM and force-kills 30s later; finish before that.
      - key: SHUTDOWN_GRACE_SECONDS
        value: "20"

      # The MCP server runs as a child process of this one, so the free
      # instance holds two Python processes. Keep the toolset list tight.
      # `trading` carries positions, orders, place_option_order and
      # close_position — without it the service starts healthy and cannot
      # trade. `news` is gone with the technical-analysis-only design.
      - key: ALPACA_TOOLSETS
        value: account,trading,assets,options-data,stock-data,news
      # Must stay exactly "true". The service refuses to start on any value
      # that would select the live agents endpoint.
      - key: ALPACA_PAPER_TRADE
        value: "true"
      - key: MARKET_PULSE_INTERVAL_SECONDS
        value: "60"
      # Every snapshot is a pure cache read (no Alpaca call, no Neon write),
      # but each one is a Telegram message — half-hourly is plenty.
      - key: TELEGRAM_SUMMARY_INTERVAL_SECONDS
        value: "1800"

      # Safety defaults. Flip DRY_RUN to false only once the risk engine and
      # the execution agent are in place and tested.
      - key: DRY_RUN
        value: "false"
      - key: KILL_SWITCH
        value: "false"

      # The dashboard (a separate Next.js app on Vercel) calls the guarded
      # /api/* routes with this bearer token and from this origin.
      #
      # The value lives here rather than in the Render dashboard on purpose:
      # it is deploy topology, not a secret, and a blueprint apply overwrites
      # whatever the dashboard holds. An empty value here means the API adds
      # no CORS middleware at all, so preflights 405 and every dashboard call
      # fails with "No 'Access-Control-Allow-Origin' header" — which is what
      # happened the first time this blueprint was re-applied.
      #
      # Comma-separated. Vercel preview deployments get their own hostnames
      # and are not covered; add them here if a preview needs live data.
      - key: CORS_ALLOWED_ORIGINS
        value: https://options-m-dashboard.vercel.app

      # Set in the Render dashboard — never committed.
      - key: DATABASE_URL
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: FEATHERLESS_CHAT_MODEL
        sync: false
      # Outbound Telegram notifications. Unset means "run without them" — the
      # reporter agent is not registered and no HTTP client is opened.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
