[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "options-m"
version = "0.1.0"
description = "Options-M application skeleton."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.4",
    # Alpaca is reached only through its official MCP server, spawned as a
    # stdio subprocess. fastmcp gives us the client half of that conversation.
    "fastmcp>=3.1",
    "alpaca-mcp-server>=2.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
options-m = "options_m.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/options_m"]
# schema.sql is loaded at runtime via importlib.resources, so it must ship.
artifacts = ["src/options_m/schema.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "S",        # bandit (security)
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]

# fastmcp is a large surface and not fully typed; keep the exemption narrow.
[[tool.mypy.overrides]]
module = ["fastmcp.*", "mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
